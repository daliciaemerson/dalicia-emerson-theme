name: Deploy to WP Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WPE_SSHG_KEY_PRIVATE }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa git.wpengine.com >> ~/.ssh/known_hosts

      - name: Add WP Engine git remote
        run: git remote add wpengine git@git.wpengine.com:production/daliciaemerson.git

      - name: Push to WP Engine
        run: git push wpengine main --force
