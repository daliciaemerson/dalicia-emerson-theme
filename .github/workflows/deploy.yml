name: Deploy to WP Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WPE_SSHG_KEY_PRIVATE }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa git.wpengine.com >> ~/.ssh/known_hosts

      - name: Wrap files in theme path
        run: |
          mkdir -p /tmp/wpe-deploy/wp-content/themes/kadence-child
          rsync -a --exclude='.git' --exclude='.github' \
            ./ /tmp/wpe-deploy/wp-content/themes/kadence-child/

      - name: Push to WP Engine
        run: |
          cd /tmp/wpe-deploy
          git init
          git config user.email "deploy@github-actions"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "deploy ${{ github.sha }}"
          git remote add wpengine git@git.wpengine.com:production/daliciaemerson.git
          git push wpengine HEAD:main --force
